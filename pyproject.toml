[project]
name = "poseguard"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "opencv-python==5.0.0.93",
    "pillow==12.2.0",
    "torch==2.13.0",
    "ultralytics==8.4.103",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
